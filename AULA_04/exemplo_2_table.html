<!DOCTYPE html>
<html lang = "pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - table</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color: #FFFFFF">
				<th>Cabeçalho 1</th>
				<th>Cabeçalho 2</th>
				<th>Cabeçalho 3</th>
		</tr>
		<tr>
			<td style="background-color:#000;color:#FFF">Conteudo 1</td>
			<td>
				<table border="1" width="100%">
					<tr>
						<td style="background-color: yellow;">1</td>
						<td style="background-color: red; color: #FFF; text-align:right">2</td>
					</tr>
					<tr>
						<td style="background-color: blue; color: #FFF; text-align:right">3</td>
						<td style="background-color:greenyellow;">4</td>
					</tr>
				</table>
			</td>
			<td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">Conteudo 2</td>
		</tr>
		<tr>
			<td style="background-color:#000;color:#FFF">Conteudo 4 </td>
			<td style="background-image:url('https://i.pinimg.com/736x/db/c7/39/dbc739b0678da4e52a9a55dd3839baee.jpg'); text-align:right">Conteudo 5</td>
			<td>
				<table border="1" width="100%">
					<tr>
						<td style="background-color: orange; text-align:center;">5</td>
						<td style="background-color: red; color: pink">6</td>
					</tr>
					<tr>
						<td style="background-color: red; color: #FFF; text-align:right">7</td>
						<td style="background-color:orange; text-align:center;">8</td>
					</tr>
				</table>
			</td>
		</tr>
		</table>
	</body>
	</html>
