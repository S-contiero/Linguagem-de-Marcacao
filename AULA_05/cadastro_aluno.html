<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de aluno </title>
	</head>
	<body>
		<header>
			<h1 style="text-align: center">Cadastro de aluno</h1>
			<hr>
		</header>
		<form action="#" method="POST">
			<label for="nome">Nome do aluno:</label>
			<br><br>
			<input type="text" id="nome" name="nome" placeholder="nome do aluno..." minlength="3" maxlength="255" required>
			<br><br>
			
			<label for="ra">Registro do aluno:</label>
			<br>
			<input  type="text" id="ra" name="ra" value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do aluno:</label>
			<br>
			<input type="email" id="email" name="email" placeholder="email@email.com" required>
			<br><br>
			
			<label for="Telefone">Telefone do aluno:</label>
			<br>
			<input type="tel" id="telefone" name="Telefone" placeholder="(00) 00000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data de nascimento:</label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2009-01-01" required>
			<br><br>
			
			<label for="data_nascimento">Idade:</label>
			<br>
			<input type="number" id="idade" name="idade" min="17" max="100" placeholder="123..." required>
			<br><br>
			
			<label for="genero">Gênero</label>
			<br>
			<input type="radio" id="mascuino" name="genero" value="Masculino" required>Masculino
			<br>
			<input type="radio" id="feminino" name="genero" value="Feminino">Feminino
			<br>
			<input type="radio" id="outros" name="genero" value="Outros">Outros
			<br><br>
			
			<label for="turma">Selecione a turma: </label>
			<br>
			<select name="turma" id="turma" required>
				<option value="Selecione">Selecione...</label>
				<option value="1EM">1º EM A</option>
				<option value="1EM">1º EM B</option>
				<option value="2EM">2º EM A</option>
				<option value="2EM">2º EM B</option>
				<option value="3EM">3º EM A</option>
				<option value="3EM">3º EM B</option>
			</select>
			<br><br>
			
			<label for="foto">Foto do aluno:</label>
			<br>
			<input type="file" id="foto" name="foto" required>
			<br><br>
				
			<label for="comentarios">Reclamação, comentario e elogios...</label>
			<br>
			<textarea id="comentario" name="comentario" placeholder="Texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required>Li e aceito os Termos e Condições
			<br>
			<input type="checkbox" id="notificacoes" name="noatificacoes">Aceito receber notoficação
			<br><br>
			
			<input type="submit" value="Cadastrar aluno">
			
			
		</form>
	</body>
</html>
