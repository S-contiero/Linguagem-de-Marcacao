<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro </title>
	</head>
	<body>
		<!-- Cria um formulario
		<form> - tag de formulario
		Atributo "action" aponta para uma pagina
		Atributo "method"
			-GET: passa os dados pelo URL
			-POST: passa para os dados pelo corpo
		-->
		<form action="#" method="POST">
			<!-- label - rótolo do campo -->
			<label>Nome Completo:</label>
			<br>
			
			<!-- input - campo de entrada de dados
				TYPE - tipo do campo 
				ID - indentificador (para javascript)
				NAME - indentificador (para PHP)
			-->
			<input type="text" id="nome" name="nome">
			<br><br>
			
			<!-- INPUT SUBMIT ceiar um botão -->
			<input type="submit" valeu="cadastrar">
		</form>
	</body>
</html>
